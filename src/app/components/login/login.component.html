<div class="login-container">
    <div class="login-card">
        <h2>Welcome Back to DineElite</h2>
        <p>Please enter your credentials to continue</p>

        <form (submit)="onSubmit($event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" required
                    placeholder="admin@dineelite.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password" required
                    placeholder="••••••••">
            </div>

            <p *ngIf="error" class="error-msg">{{error}}</p>

            <button type="submit" class="btn-login" [disabled]="loading">
                {{loading ? 'Signing in...' : 'Sign In'}}
            </button>
        </form>

        <div class="demo-creds">
            <strong>Demo Accounts:</strong><br>
            Admin: admin&#64;dineelite.com / pass<br>
            User: rahul&#64;test.com / pass
        </div>

        <div class="register-link">
            Don't have an account? <a routerLink="/register" class="register-link-action">Create Account</a>
        </div>
    </div>
</div>
