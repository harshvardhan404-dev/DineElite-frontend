<nav *ngIf="authService.isLoggedIn() && !isLoginPage" class="glass nav-ultra" [class.menu-open]="isMobileMenuOpen">
  <div class="nav-container">
    <div class="brand-section">
      <a routerLink="/" class="gradient-text">DineElite</a>
    </div>

    <button class="menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle navigation">
      <div class="hamburger" [class.open]="isMobileMenuOpen">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </button>

    <ul class="nav-links" [class.mobile-active]="isMobileMenuOpen">
      <li>
        <a routerLink="/booking" routerLinkActive="active-link" class="nav-item-link">Book a Table</a>
      </li>
      <li *ngIf="authService.isLoggedIn()">
        <a routerLink="/feed" routerLinkActive="active-link" class="nav-item-link">Elite Moments</a>
      </li>
      <li *ngIf="authService.isLoggedIn() && authService.getRole() !== 'ADMIN'">
        <a routerLink="/history" routerLinkActive="active-link" class="nav-item-link">Booking History</a>
      </li>
      <li *ngIf="authService.isLoggedIn() && authService.getRole() === 'ADMIN'">
        <a routerLink="/dashboard" routerLinkActive="active-link" class="nav-item-link admin-dashboard-link">Admin
          Dashboard</a>
      </li>
      <li *ngIf="authService.isLoggedIn() && authService.getRole() === 'ADMIN'">
        <a routerLink="/notifications" routerLinkActive="active-link" class="nav-item-link">
          Notifications <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </a>
      </li>
      <li *ngIf="authService.isLoggedIn()">
        <a routerLink="/profile" routerLinkActive="active-link" class="nav-item-link">Profile</a>
      </li>
      <li *ngIf="authService.isLoggedIn()">
        <a href="javascript:void(0)" (click)="logout()" class="nav-item-link btn-logout">Logout</a>
      </li>
    </ul>
  </div>
</nav>

<app-global-alert></app-global-alert>
<router-outlet></router-outlet>
